name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove personal data before posting:** serial number, machine name, email, wifi name,
        tokens. Do not paste raw output from `scripts/discover.py`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you asked or ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or script
      placeholder: e.g. get_last_coffees, set_steam, scripts/setup_credentials.py
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: |
        The tool error, or the end of the server log. Claude Desktop on macOS logs to
        `~/Library/Logs/Claude/mcp-server-lamarzocco.log`.
      render: text
  - type: input
    id: model
    attributes:
      label: Machine model and firmware
      description: Firmware versions are in get_machine_settings (`actualFirmwares`).
      placeholder: e.g. Linea Micra, machine v1.17, gateway v7.5.3
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Desktop 1.x, Claude Code 2.x
  - type: input
    id: versions
    attributes:
      label: lamarzocco-mcp and pylamarzocco versions
      description: "`uv pip show lamarzocco-mcp pylamarzocco`, or the commit you run from."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed serial numbers, names, emails, wifi names and tokens from this issue.
          required: true

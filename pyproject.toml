[project]
name = "lamarzocco-mcp"
version = "0.1.0"
description = "Unofficial MCP server for La Marzocco home espresso machines (not affiliated with La Marzocco)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emil Madsen" }]
requires-python = ">=3.13"
keywords = ["mcp", "model-context-protocol", "la-marzocco", "espresso", "claude", "pylamarzocco"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "pylamarzocco>=2.5,<2.6",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Streamable HTTP + single-user OAuth for use from claude.ai (`lamarzocco-mcp serve --http`)
remote = ["mcp-owner-auth>=0.1.1"]

[project.urls]
Homepage = "https://github.com/EmilbMadsen/lamarzocco-mcp"
Issues = "https://github.com/EmilbMadsen/lamarzocco-mcp/issues"
Changelog = "https://github.com/EmilbMadsen/lamarzocco-mcp/releases"

[project.scripts]
lamarzocco-mcp = "lamarzocco_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mcp-owner-auth>=0.1.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
# Until mcp-owner-auth 0.1.1 is on PyPI. Only affects uv; the published metadata is the plain
# requirement above.
mcp-owner-auth = { git = "https://github.com/EmilbMadsen/mcp-owner-auth", rev = "72e3ddc" }

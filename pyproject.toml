[project]
name = "lamarzocco-mcp"
version = "0.1.0"
description = "Unofficial MCP server for La Marzocco home espresso machines (not affiliated with La Marzocco)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emil Madsen" }]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "mcp[cli]>=2.3.0",
    "pylamarzocco>=2.5,<2.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
